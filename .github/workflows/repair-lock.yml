name: CIT lockfile maintenance
on:
  push:
    branches: [chore/cit-p01-p11]
    paths: [.github/workflows/repair-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Regenerate lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only the generated lock, never rewrite history
        run: |
          git config user.name 'CIT dependency maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): regenerate npm lock from pinned manifest'
            git push origin HEAD:chore/cit-p01-p11
          fi
      - name: Install from regenerated lock
        run: npm ci --ignore-scripts
      - name: Package offline test dependencies
        run: tar -czf /tmp/cit-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cit-offline-dependencies
          path: /tmp/cit-dependencies.tgz
          retention-days: 1
