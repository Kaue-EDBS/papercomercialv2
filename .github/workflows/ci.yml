name: CIT verification
on:
  push:
    branches: [main, chore/cit-p01-p11]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare source-only verification artifact
        run: git archive HEAD -o /tmp/cit-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cit-source-${{ github.sha }}
          path: /tmp/cit-source.tar
          retention-days: 1
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
