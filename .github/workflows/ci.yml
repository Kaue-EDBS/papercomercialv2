name: CIT verification
on:
  push:
    branches: [main, chore/cit-p01-p11]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Branch-only verification snapshot
        if: github.ref == 'refs/heads/chore/cit-p01-p11'
        run: git archive HEAD -o /tmp/cit-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/chore/cit-p01-p11'
        with:
          name: cit-source-${{ github.sha }}
          path: /tmp/cit-source.tar
          retention-days: 1
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npm run check:public-config
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
