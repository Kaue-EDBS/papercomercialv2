name: CIT production connection verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connection-preflight.yml'
      - 'scripts/primary_session.py'
      - 'scripts/replication_preflight.py'
      - 'scripts/connection_snapshot_readonly.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cit-production-replication
  cancel-in-progress: false
jobs:
  verify_connections:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cit-production-replication
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test connection normalization without secrets
        run: python -m unittest discover -s tests -p test_primary_session.py -v
      - name: Install pinned worker dependency
        run: python -m pip install -r scripts/requirements-worker.txt
      - name: Install Supabase CA certificate
        env:
          CIT_SUPABASE_CA_CERT: ${{ secrets.CIT_SUPABASE_CA_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CIT_SUPABASE_CA_CERT" || { echo 'CIT_SUPABASE_CA_CERT is not configured'; exit 2; }
          install -d -m 700 "$RUNNER_TEMP/postgresql"
          printf '%s\n' "$CIT_SUPABASE_CA_CERT" > "$RUNNER_TEMP/postgresql/root.crt"
          chmod 600 "$RUNNER_TEMP/postgresql/root.crt"
          openssl x509 -in "$RUNNER_TEMP/postgresql/root.crt" -noout >/dev/null
          echo "PGSSLROOTCERT=$RUNNER_TEMP/postgresql/root.crt" >> "$GITHUB_ENV"
      - name: Read-only connection preflight
        env:
          CIT_PRIMARY_DATABASE_URL: ${{ secrets.CIT_PRIMARY_DATABASE_URL }}
          CIT_REPLICA_DATABASE_URL: ${{ secrets.CIT_REPLICA_DATABASE_URL }}
        run: python scripts/primary_session.py preflight
      - name: Read-only geography and migration 0007 verification
        env:
          CIT_PRIMARY_DATABASE_URL: ${{ secrets.CIT_PRIMARY_DATABASE_URL }}
          CIT_REPLICA_DATABASE_URL: ${{ secrets.CIT_REPLICA_DATABASE_URL }}
        run: python scripts/primary_session.py snapshot
