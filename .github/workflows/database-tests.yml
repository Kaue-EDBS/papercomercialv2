name: CIT database verification
on:
  push:
    branches: [main]
    paths: ['database/**', 'supabase/migrations/**', 'scripts/test-db.sh', '.github/workflows/database-tests.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cit-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_production_secret
          POSTGRES_DB: cit_ci
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      CIT_TEST_DB_URL: postgresql://postgres:ci_only_not_a_production_secret@localhost:5432/cit_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test isolated ingestion database
        run: bash scripts/test-db.sh
