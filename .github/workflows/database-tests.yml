name: CIT database verification
on:
  push:
    branches: [main, chore/cit-p01-p11, chore/cit-replication-credentials]
    paths: ['database/**', 'scripts/**', 'tests/**', '.github/workflows/database-tests.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cit-db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_production_secret
          POSTGRES_DB: cit_ci
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      CIT_TEST_DB_URL: postgresql://postgres:ci_only_not_a_production_secret@localhost:5432/cit_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test isolated ingestion database
        run: bash scripts/test-db.sh
      - name: Prepare independent replica fixture
        run: |
          psql "$CIT_TEST_DB_URL" -X -v ON_ERROR_STOP=1 -c 'create database cit_ci_replica'
          REPLICA_URL="${CIT_TEST_DB_URL%/cit_ci}/cit_ci_replica"
          psql "$REPLICA_URL" -X -v ON_ERROR_STOP=1 -f database/tests/bootstrap.sql
          for file in database/v2/0001_foundation.sql database/v2/0002_geografia_dtb_2025_cep5.sql database/v2/0003_cit_ingestion_access.sql database/v2/0004_replication_control.sql database/v2/0005_replication_roles.sql database/v2/0006_replication_login_principals.sql; do
            psql "$REPLICA_URL" -X -v ON_ERROR_STOP=1 -f "$file"
          done
          psql "$CIT_TEST_DB_URL" -X -v ON_ERROR_STOP=1 -f database/tests/replication-seed.sql
      - name: Install pinned worker dependency
        run: python -m pip install -r scripts/requirements-worker.txt
      - name: Verify sanitized preflight diagnostics
        run: python -m unittest tests/test_replication_preflight.py
      - name: Verify interrupted transfer, replay, deletion gate and audit delivery
        run: python tests/integration_replication.py
